[project]
name = "wisprflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pyaudio>=0.2.14",
    "pyperclip>=1.11.0",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
]

[project.scripts]
wisprflow = "wisprflow:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
